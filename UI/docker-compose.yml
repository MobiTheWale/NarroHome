version: '3.9'

services:
  narroparty-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: narroparty-app
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

